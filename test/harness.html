<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Kyareeh+ harness</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0b0c10; color: #fff; font-family: system-ui, sans-serif; }
      body { padding: 24px; }
      h1 { font-size: 16px; color: #ff8a6d; }
      p { color: #9aa0ae; font-size: 12px; max-width: 520px; }
      #log { margin-top: 18px; padding: 10px; border: 1px solid #2d303a; border-radius: 8px; background: #121318; font: 11px ui-monospace, monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Kyareeh+ — harness de test</h1>
      <p>Page locale avec API simulée. Le panneau doit s'ouvrir automatiquement (Alt+K).</p>
      <div id="log"></div>

    <script>
      const logEl = document.getElementById('log');
      const log = (msg) => { logEl.textContent += msg + '\n'; };
      window.addEventListener('error', (e) => log('ERROR: ' + e.message));
      window.addEventListener('unhandledrejection', (e) => log('REJECTION: ' + (e.reason?.message || e.reason)));

      // Stockage persistant (localStorage) pour pouvoir tester la reprise après rechargement.
      // Même clé que duel/duel-app.js hors extension : la page du duel (iframe ou fenêtre ouverte
      // par « Détacher ») partage ce stockage ; on relit donc toujours la valeur la plus récente.
      const STORE_KEY = 'kp-harness-store';
      const readStore = () => {
        try {
          return JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {};
        } catch {
          return {};
        }
      };
      const store = readStore();
      // Clé de fenêtre périmée d'une session précédente : aucune fenêtre n'est ouverte au chargement.
      if (store['kyareeh.duel.window']) {
        delete store['kyareeh.duel.window'];
        localStorage.setItem(STORE_KEY, JSON.stringify(store));
      }
      window.__harnessStore = store;
      const changeListeners = [];
      const emitChanges = (changes) => {
        if (!Object.keys(changes).length) return;
        for (const fn of changeListeners) {
          try {
            fn(changes, 'local');
          } catch (e) {
            log('onChanged: ' + e.message);
          }
        }
      };
      // Changements faits par une autre page (iframe du duel, fenêtre détachée).
      window.addEventListener('storage', (event) => {
        if (event.key !== STORE_KEY) return;
        let before = {};
        const after = readStore();
        try {
          before = JSON.parse(event.oldValue || '{}') || {};
        } catch {
          before = {};
        }
        for (const k of Object.keys(store)) delete store[k];
        Object.assign(store, after);
        const changes = {};
        for (const k of new Set([...Object.keys(before), ...Object.keys(after)])) {
          if (JSON.stringify(before[k]) !== JSON.stringify(after[k])) changes[k] = { oldValue: before[k], newValue: after[k] };
        }
        emitChanges(changes);
      });
      // Fenêtre détachée du duel (équivalent harness du script de fond : windows.create).
      let duelWin = null;
      const duelWinWatch = () => {
        clearInterval(duelWinWatch.t);
        duelWinWatch.t = setInterval(() => {
          if (duelWin && !duelWin.closed) return;
          clearInterval(duelWinWatch.t);
          duelWin = null;
          const cur = readStore();
          if (cur['kyareeh.duel.window']) {
            delete cur['kyareeh.duel.window'];
            localStorage.setItem(STORE_KEY, JSON.stringify(cur));
            const old = store['kyareeh.duel.window'];
            delete store['kyareeh.duel.window'];
            emitChanges({ 'kyareeh.duel.window': { oldValue: old, newValue: undefined } });
          }
        }, 500);
      };
      const setWindowKey = (value) => {
        const cur = readStore();
        const old = cur['kyareeh.duel.window'];
        if (value) cur['kyareeh.duel.window'] = value;
        else delete cur['kyareeh.duel.window'];
        localStorage.setItem(STORE_KEY, JSON.stringify(cur));
        Object.keys(store).forEach((k) => delete store[k]);
        Object.assign(store, cur);
        emitChanges({ 'kyareeh.duel.window': { oldValue: old, newValue: value || undefined } });
      };
      // Régénération simulée : minutes restantes avant le prochain booster.
      window.__nextFreeMin = window.__nextFreeMin ?? 10;
      window.browser = {
        storage: {
          local: {
            get: async (key) => ({ [key]: readStore()[key] }),
            set: async (obj) => {
              const cur = readStore();
              const changes = {};
              for (const [k, v] of Object.entries(obj)) changes[k] = { oldValue: cur[k], newValue: v };
              Object.assign(cur, obj);
              localStorage.setItem(STORE_KEY, JSON.stringify(cur));
              Object.assign(store, obj);
              emitChanges(changes);
            }
          },
          onChanged: { addListener: (fn) => changeListeners.push(fn) }
        },
        runtime: {
          getURL: (path) => '/' + path,
          onMessage: { addListener: () => {} },
          // Réponses du script de fond pour le duel (background/background.js).
          sendMessage: async (msg) => {
            if (msg && msg.type === 'kp-duel-detach') {
              if (duelWin && !duelWin.closed) {
                duelWin.focus();
                return { ok: true, reused: true };
              }
              duelWin = window.open('/duel/duel.html', 'kp-duel', 'popup,width=1100,height=760');
              if (!duelWin) return { ok: false, error: 'fenêtre bloquée' };
              setWindowKey({ id: 'harness', at: Date.now() });
              duelWinWatch();
              return { ok: true, id: 'harness' };
            }
            if (msg && msg.type === 'kp-duel-attach') {
              try {
                if (duelWin) duelWin.close();
              } catch (e) {
                /* ignore */
              }
              duelWin = null;
              setWindowKey(null);
              return { ok: true };
            }
            return undefined;
          }
        },
        tabs: {}
      };

      const CHARACTERS = [
        { id: 127691, name: 'Satoru Gojou', rarity: 'M', series: 'JUJUTSU KAISEN', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b127691-9zqh1xpIubn7.png' },
        { id: 10668, name: 'Conis', rarity: 'C', series: 'ONE PIECE', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b10668-JCNeCZ2ap8UR.png' },
        { id: 282077, name: 'Vegapunk', rarity: 'C', series: 'ONE PIECE', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b282077-sPmt79g4douV.jpg' },
        { id: 21122, name: 'Mikoto Uchiha', rarity: 'C', series: 'Naruto', image: 'https://s4.anilist.co/file/anilistcdn/character/large/n21122-blSqxSAMDwXf.png' },
        { id: 999001, name: 'Naruto Uzumaki', rarity: 'L', series: 'Naruto', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b17-6LajS4M0J8c0.png' },
        { id: 999002, name: 'Monkey D. Luffy', rarity: 'E', series: 'ONE PIECE', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b40-5K1xJ0m6w7jK.png' },
        { id: 45627, name: 'Yuki Nagato', rarity: 'R', series: 'The Melancholy of Haruhi Suzumiya', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b45627-8Gm5zY0q9dKx.png' },
        { id: 45628, name: 'Itsuki Koizumi', rarity: 'R', series: 'The Melancholy of Haruhi Suzumiya', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b45628-2Kp9xR1mQ7aB.png' },
        { id: 31337, name: 'Héritage Test', rarity: 'H', series: 'Test', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b45628-2Kp9xR1mQ7aB.png' }
      ];

      // Joueurs simulés pour l'onglet Stat global (données publiques).
      const STAT_PLAYERS = [
        { id: 'p-1', pseudo: 'Ratek', owned: 6528, mythics: 101, heritage: 4, boostersOpened: 1841, points: 69811, series: 204, achievements: 25, byRarity: { C: 1630, U: 1683, R: 1683, E: 1010, L: 421, M: 101, H: 4 } },
        { id: 'p-2', pseudo: 'Pharysse', owned: 6364, mythics: 23, heritage: 0, boostersOpened: 1434, points: 48873, series: 157, achievements: 1, byRarity: { C: 1650, U: 1684, R: 1684, E: 1009, L: 314, M: 23 } },
        { id: 'p-3', pseudo: 'Waldox', owned: 2875, mythics: 97, heritage: 2, boostersOpened: 603, points: 29655, series: 5, achievements: 0, byRarity: { C: 1200, U: 800, R: 700, E: 76, L: 0, M: 97, H: 2 } },
        { id: 'p-4', pseudo: 'fayura', owned: 6159, mythics: 5, heritage: 1, boostersOpened: 980, points: 34451, series: 118, achievements: 3, byRarity: { C: 1600, U: 1700, R: 1700, E: 1153, L: 1, M: 5, H: 1 } },
        { id: 'p-5', pseudo: 'Menkoy', owned: 1765, mythics: 71, heritage: 0, boostersOpened: 210, points: 19430, series: 3, achievements: 0, byRarity: { C: 800, U: 600, R: 290, E: 4, L: 0, M: 71 } },
        { id: 'p-6', pseudo: 'SHADOW-2', owned: 5794, mythics: 72, heritage: 3, boostersOpened: 1203, points: 44292, series: 81, achievements: 9, byRarity: { C: 1700, U: 1600, R: 1500, E: 900, L: 22, M: 72, H: 3 } }
      ];
      const STAT_KEYS = ['mythics', 'owned', 'heritage', 'boostersOpened', 'points', 'series', 'achievements'];
      const statCollectionIds = (player) => {
        const ids = [];
        const pool = [127691, 999001, 10668, 282077, 21122, 999002, 45627, 45628, 31337];
        for (let i = 0; i < Math.min(player.owned, 40); i += 1) ids.push(String(pool[i % pool.length]));
        return ids;
      };

      // Revente bloquée 48 h après un achat : même vocabulaire que le site.
      const RESALE_UNTIL = new Date(Date.now() + 30 * 3600e3).toISOString();

      const PRICES = {
        127691: { median7d: 1200, median30d: 1100, sales7d: 4, sales30d: 9 },
        10668: { median7d: 3, median30d: 3, sales7d: 50, sales30d: 50 },
        282077: { median7d: 16, median30d: 16, sales7d: 83, sales30d: 85 },
        21122: { median7d: 4, median30d: 4, sales7d: 40, sales30d: 44 },
        999001: { median7d: 90, median30d: 80, sales7d: 12, sales30d: 20 },
        999002: { median7d: 25, median30d: 22, sales7d: 30, sales30d: 41 },
        45627: { median7d: 140, median30d: 150, sales7d: 9, sales30d: 28 },
        45628: { median7d: 60, median30d: 55, sales7d: 6, sales30d: 18 }
      };

      const COLLECTION = [
        { characterId: 127691, qty: 2, listable: 1 },
        { characterId: 10668, qty: 4, listable: 3 },
        { characterId: 282077, qty: 3, listable: 2 },
        { characterId: 21122, qty: 1, listable: 0 },
        { characterId: 999001, qty: 2, listable: 1 },
        { characterId: 999002, qty: 1, listable: 1 },
        // Achetée récemment : revente bloquée jusqu'à RESALE_UNTIL.
        {
          characterId: 45627,
          qty: 2,
          listable: 0,
          locked: 2,
          sellBlock: 'resale_lock',
          resaleUntil: RESALE_UNTIL,
          firstAt: new Date(Date.now() - 18 * 3600e3).toISOString()
        },
        // Carte unique déjà mise en vente (escrow).
        {
          characterId: 45628,
          qty: 1,
          listable: 0,
          locked: 1,
          sellBlock: 'in_escrow',
          escrow: { listings: 1 }
        }
      ];

      // État mutable du marché : les POST de la vente auto doivent réellement
      // apparaître dans /api/me/market et retirer une copie listable.
      const MARKET_STATE = {
        collection: COLLECTION.map((row) => ({ ...row })),
        listings: [
          { id: 'mine-1', characterId: 21122, character: CHARACTERS[3], type: 'fixed', price: 9, status: 'active', qty: 1, endsAt: new Date(Date.now() + 8 * 3600e3).toISOString() },
          { id: 'mine-2', characterId: 45628, character: CHARACTERS[7], type: 'auction', price: 5, currentBid: 7, bidCount: 2, status: 'active', qty: 1, endsAt: new Date(Date.now() + 3 * 3600e3).toISOString() },
          { id: 'mine-3', characterId: 999002, character: CHARACTERS[5], type: 'fixed', price: 25, status: 'active', qty: 1, endsAt: new Date(Date.now() + 6 * 3600e3).toISOString() }
        ]
      };

      const CONFIG = {
        catalogSize: 6736,
        freePacks: { max: 10 },
        recycle: { C: 1, U: 1, R: 3, E: 10, L: 40, M: 150 },
        pity: { threshold: 250, rarity: 'M' }
      };

      const json = (data) => new Response(JSON.stringify(data), { status: 200, headers: { 'content-type': 'application/json' } });

      const realFetch = window.fetch.bind(window);
      window.fetch = async (input, init) => {
        const url = String(input);
        if (!url.includes('/api/')) return realFetch(input, init);
        log('API ' + (init?.method || 'GET') + ' ' + url);

        const path = new URL(url, location.href).pathname;

        if (path.endsWith('/open-many')) {
          const body = JSON.parse(init?.body || '{}');
          const n = Math.max(1, Math.min(10, Number(body.count) || 1));
          const pool = CHARACTERS;
          const results = Array.from({ length: n }, (_, i) => ({
            cards: [pool[(i + n) % pool.length]],
            golden: i === 0,
            godPack: false,
            pity: false
          }));
          return json({ results });
        }
        if (path === '/api/me/packs') return json({ grants: {}, limits: {} });
        if (path === '/api/me') {
          return json({
            id: 'u-axel',
            pseudo: 'Axel',
            chakra: 12345,
            freePacks: 7,
            bonusPacks: 2,
            freePacksMax: 10,
            nextFreeAt: new Date(Date.now() + (window.__nextFreeMin ?? 10) * 60000).toISOString(),
            pity: 120
          });
        }

        if (url.includes('/api/me/collection/prices')) {
          const ids = new URL(url, location.href).searchParams.get('ids').split(',');
          return json(ids.map((id) => ({ characterId: Number(id), ...(PRICES[id] || {}) })));
        }
        if (url.includes('/api/me/bootstrap')) {
          return json({
            me: {
              id: 'u-axel',
              pseudo: 'Axel',
              avatar: null,
              title: 'Collectionneur',
              rank: { id: 'expert', label: 'Expert', points: 9819 },
              chakra: 12345,
              freePacks: 7,
              freePacksMax: 10,
              nextFreeAt: new Date(Date.now() + (window.__nextFreeMin ?? 10) * 60000).toISOString(),
              bonusPacks: 2,
              pity: 120
            },
            wishlist: []
          });
        }
        if (url.includes('/api/me/collection')) {
          // ?duel=1 : le compte simulé possède aussi les 8 premières Mythiques du duel
          // (deck en ligne complet possible dans le harness).
          if (new URLSearchParams(location.search).has('duel') && window.KYARA_DUEL_DATA) {
            const mythics = window.KYARA_DUEL_DATA.champions.filter((c) => c.rarity === 'M').slice(0, 8);
            return json([...MARKET_STATE.collection, ...mythics.map((c) => ({ characterId: c.id, qty: 1, listable: 0 }))]);
          }
          return json(MARKET_STATE.collection);
        }
        if (url.includes('/api/characters')) return json(CHARACTERS);
        if (url.includes('/api/config')) return json(CONFIG);
        if (url.includes('/api/me/market')) {
          return json({ listings: MARKET_STATE.listings, buyOrders: [] });
        }
        if (url.includes('/api/trades/owned/')) {
          const id = decodeURIComponent(url.split('/api/trades/owned/')[1].split(/[?#]/)[0]);
          const stat = STAT_PLAYERS.find((player) => player.id === id);
          if (stat) return json(statCollectionIds(stat));
          if (id === 'amo-uuid') return json([31337, 127691]);
          if (id === 'amoulle-uuid') return json([31337, 127691, 999001, 45627, 45628, 127691]);
          return json([127691, 999001, 10668, 282077, 21122, 999002, 127691]);
        }
        if (url.includes('/api/users/')) {
          const id = decodeURIComponent(url.split('/api/users/')[1].split(/[?#]/)[0]);
          // Compte connecté : profil complet pour alimenter toutes les colonnes.
          if (id === 'u-axel') {
            return json({
              id: 'u-axel',
              pseudo: 'Axel',
              avatar: null,
              owned: 8,
              doublesCount: 8,
              mythics: 1,
              heritage: 0,
              boostersOpened: 32,
              points: 1200,
              catalogSize: 9,
              byRarity: { C: 3, R: 2, E: 1, L: 1, M: 1 },
              listings: [{ id: 'l1' }, { id: 'l2' }],
              best: []
            });
          }
          const stat = STAT_PLAYERS.find((player) => player.id === id);
          if (stat) {
            return json({
              id: stat.id,
              pseudo: stat.pseudo,
              avatar: null,
              owned: stat.owned,
              mythics: stat.mythics,
              heritage: stat.heritage,
              boostersOpened: stat.boostersOpened,
              points: stat.points,
              series: stat.series,
              achievements: stat.achievements,
              byRarity: stat.byRarity,
              catalogSize: 6736,
              best: []
            });
          }
          const seen = {
            'amo-uuid': { id: 'amo-uuid', pseudo: 'Amo', avatar: null, rank: { id: 'rookie', label: 'Rookie' }, owned: 12, mythics: 0, points: 40, best: [] },
            'amoulle-uuid': { id: 'amoulle-uuid', pseudo: 'Amoulle', avatar: null, rank: { id: 'expert', label: 'Expert' }, owned: 5499, mythics: 12, points: 9819, best: [] }
          };
          return json(seen[id] || { id, pseudo: 'Joueur ' + id, avatar: null, owned: 0, mythics: 0, points: 0, best: [] });
        }
        if (url.includes('/api/fair-play/prices')) {
          const ids = new URL(url, location.href).searchParams.get('ids').split(',');
          const out = {};
          for (const id of ids) {
            const p = PRICES[id];
            out[id] = p ? p.median7d : 0;
          }
          return json(out);
        }
        if (url.includes('/api/packs')) {
          const packChars = url.match(/\/api\/packs\/([^/]+)\/characters/);
          if (packChars) {
            const id = packChars[1];
            const pool = id === 'premium' ? [127691, 999001, 45627] : [127691, 999001, 10668, 282077, 21122, 999002, 45627, 40];
            return json(pool);
          }
          const mk = (id, name, color, price, slots, perRarity, extra = {}) => ({
            id,
            name,
            color,
            price: 0,
            chakraPrice: price,
            usesFreePacks: true,
            goldenEligible: true,
            grantOnly: false,
            slots,
            rateUp: null,
            schedule: null,
            pool: {},
            rates: {
              poolSize: 8,
              cardsByRarity: { C: 3, U: 0, R: 0, E: 1, L: 1, M: 1 },
              slots: slots.map((min, i) => ({
                min,
                pct:
                  i === 0
                    ? { C: 62, U: 25, R: 11.4, E: 1.4, L: 0.15, M: 0.025 }
                    : i === 1
                      ? { C: 0, U: 65.8, R: 30.1, E: 3.68, L: 0.39, M: 0.065 }
                      : { C: 0, U: 0, R: 87.8, E: 10.79, L: 1.15, M: 0.19 }
              })),
              perBooster: perRarity,
              golden: {
                slots: [
                  { min: 'C', pct: { C: 62, U: 25, R: 11.4, E: 1.4, L: 0.15, M: 0.025 } },
                  { min: 'C', pct: { C: 62, U: 25, R: 11.4, E: 1.4, L: 0.15, M: 0.025 } },
                  { min: 'U', pct: { C: 0, U: 65.8, R: 30.1, E: 3.68, L: 0.39, M: 0.065 } },
                  { min: 'R', pct: { C: 0, U: 0, R: 87.8, E: 10.79, L: 1.15, M: 0.19 } },
                  { min: 'E', pct: { C: 0, U: 0, R: 0, E: 88.9, L: 9.52, M: 1.59 } }
                ]
              }
            },
            ...extra
          });
          return json([
            mk('all', 'Shōnen Mix', '#F5C518', 150, ['C', 'C', 'R'], { M: { perCardPct: 0.15 } }),
            mk('premium', 'Premium Deluxe', '#ff4d2e', 600, ['R', 'R', 'E'], { M: { perCardPct: 0.4 } }, {
              rateUp: { characterIds: [127691, 45627], rarities: ['M'], share: 0.5 }
            })
          ]);
        }
        if (url.includes('/api/me/friends') && !url.includes('/search')) {
          // Liste d'amis du compte connecté : même enveloppe que le vrai serveur.
          return json({
            friends: [
              { id: 'amo-uuid', pseudo: 'Amo', avatar: null, since: '2026-01-02T00:00:00Z', online: true },
              { id: 'amoulle-uuid', pseudo: 'Amoulle', avatar: null, since: '2026-02-03T00:00:00Z', online: false }
            ],
            incoming: [],
            max: 50
          });
        }
        if (url.includes('/api/me/friends/search')) {
          const q = new URL(url, location.href).searchParams.get('q') || '';
          if (!q.trim()) return json([]);
          // Joue le cas qui cassait la recherche : un joueur à petite collection,
          // absent du top 10 du classement.
          if (/^amo/i.test(q)) {
            return json([
              {
                id: 'amo-uuid',
                pseudo: 'Amo',
                avatar: null,
                rank: { id: 'rookie', label: 'Rookie' },
                owned: 12,
                mythics: 0,
                points: 40,
                status: 'friends'
              },
              {
                id: 'amoulle-uuid',
                pseudo: 'Amoulle',
                avatar: null,
                rank: { id: 'expert', label: 'Expert' },
                owned: 5499,
                mythics: 12,
                points: 9819,
                status: 'none'
              }
            ]);
          }
          return json([]);
        }
        if (url.includes('/api/leaderboard/ladder')) {
          const by = new URL(url, location.href).searchParams.get('by') || 'collection';
          const key = STAT_KEYS.includes(by) ? by : 'owned';
          const sorted = [...STAT_PLAYERS].sort((a, b) => (b[key] || 0) - (a[key] || 0));
          const rows = sorted.map((player, index) => ({
            pos: index + 1,
            id: player.id,
            pseudo: player.pseudo,
            avatar: null,
            owned: player.owned,
            mythics: player.mythics,
            points: player.points,
            series: player.series,
            achievements: player.achievements
          }));
          // Deux comptes hors du top 100 : sert à vérifier la colonne Rang.
          rows.push(
            { pos: 11704, id: 'amo-uuid', pseudo: 'Amo', avatar: null, owned: 12, mythics: 0 },
            { pos: 250, id: 'amoulle-uuid', pseudo: 'Amoulle', avatar: null, owned: 5499, mythics: 12 }
          );
          // `q` : le vrai serveur renvoie `found` filtré par pseudo.
          const q = (new URL(url, location.href).searchParams.get('q') || '').toLowerCase();
          const found = q ? rows.filter((row) => String(row.pseudo).toLowerCase().includes(q)) : rows;
          return json({
            by,
            rows,
            found,
            me: null,
            total: by === 'mythics' ? 52022 : 105742,
            catalogSize: 6736
          });
        }
        if (/\/api\/users\/[^/]+$/.test(url)) {
          return json({
            id: '62937049-55d0-4534-8b0f-7e4de3cdc278',
            pseudo: 'neffeeh',
            rank: { id: 'expert', label: 'Expert' },
            catalogSize: 6736,
            byRarity: { C: 1500, U: 300, R: 80, E: 18, L: 3 },
            best: [
              { id: 127691, name: 'Satoru Gojou', rarity: 'M', series: 'JUJUTSU KAISEN', image: CHARACTERS[0].image },
              { id: 999001, name: 'Naruto Uzumaki', rarity: 'L', series: 'Naruto', image: CHARACTERS[4].image }
            ],
            blocks: [],
            locked: [],
            listings: [],
            buyOrders: []
          });
        }
        if (url.includes('/api/me/market/access')) return json({ allowed: true });

        const priceMatch = url.match(/\/api\/market\/prices\/(\d+)/);
        if (priceMatch) {
          const id = priceMatch[1];
          const base = PRICES[id] || { median7d: null, median30d: null, sales7d: 0, sales30d: 0 };
          // Série journalière simulée : 10 jours, tendance +3 %/jour, volume variable.
          const median = base.median7d ?? 10;
          const days = Array.from({ length: 10 }, (_, i) => {
            const d = new Date(Date.now() - (9 - i) * 86400000);
            return {
              day: d.toISOString().slice(0, 10),
              median: Math.max(1, Math.round(median * Math.pow(0.97, 9 - i))),
              n: 2 + ((i * 3) % 8)
            };
          });
          const lastSales = Array.from({ length: 20 }, (_, i) => ({
            price: Math.max(1, Math.round(median * (0.85 + ((i * 7) % 30) / 100))),
            at: new Date(Date.now() - i * 3600e3).toISOString(),
            source: i % 3 === 0 ? 'auction' : i % 5 === 0 ? 'buy_order' : 'listing'
          }));
          return json({
            characterId: Number(id),
            ...base,
            lastPrice: lastSales[0].price,
            lastAt: lastSales[0].at,
            days,
            lastSales
          });
        }

        if (url.includes('/api/market/buy-orders')) {
          const id = new URL(url, location.href).searchParams.get('characterId');
          const p = PRICES[id];
          return json(
            p
              ? [
                  { price: Math.max(1, Math.round(p.median7d * 0.95)), qty: 2, status: 'open' },
                  { price: Math.max(1, Math.round(p.median7d * 0.8)), qty: 1, status: 'open' }
                ]
              : []
          );
        }

        if (url.includes('/api/market/prices/')) {
          const id = decodeURIComponent(url.split('/api/market/prices/')[1].split(/[?#]/)[0]);
          const p = PRICES[id];
          return json(p ? { characterId: Number(id), ...p } : {});
        }

        if (url.includes('/api/market/listings') && String(init?.method || 'GET').toUpperCase() === 'POST') {
          const body = JSON.parse(init?.body || '{}');
          const characterId = Number(body.characterId);
          const row = MARKET_STATE.collection.find((item) => Number(item.characterId) === characterId);
          const active = MARKET_STATE.listings.filter((item) => item.status === 'active').length;
          const fail = (code, message) =>
            new Response(JSON.stringify({ code, message }), {
              status: 400,
              headers: { 'content-type': 'application/json' }
            });
          if (active >= 10) return fail('too_many_listings', 'Limite d’annonces actives atteinte.');
          if (!row || Number(row.listable ?? Math.max(0, row.qty - 1)) <= 0) {
            return fail('not_listable', 'Cette carte n’est pas listable.');
          }
          row.listable = Math.max(0, Number(row.listable ?? Math.max(0, row.qty - 1)) - 1);
          const card = CHARACTERS.find((item) => Number(item.id) === characterId) || null;
          const listing = {
            id: 'auto-' + Date.now() + '-' + MARKET_STATE.listings.length,
            characterId,
            character: card,
            type: body.type === 'auction' ? 'auction' : 'fixed',
            price: Number(body.price),
            buyoutPrice: body.buyoutPrice ?? null,
            status: 'active',
            qty: 1,
            endsAt: new Date(Date.now() + (Number(body.durationHours) || 12) * 3600e3).toISOString()
          };
          MARKET_STATE.listings.unshift(listing);
          log('   -> listing créé: ' + (init?.body || ''));
          return json({ ok: true, id: listing.id, listing, matched: false });
        }

        if (url.includes('/api/market/listings')) {
          const params = new URL(url, location.href).searchParams;
          const id = params.get('characterId');
          if (id) {
            const p = PRICES[id];
            const c = CHARACTERS.find((x) => String(x.id) === String(id));
            return json({
              items: p
                ? [
                    { id: 'l-' + id, characterId: Number(id), character: c, type: 'fixed', price: p.median7d + 2, prices: p },
                    { id: 'm-' + id, characterId: Number(id), character: c, type: 'auction', price: Math.round(p.median7d * 0.8), buyoutPrice: p.median7d, prices: p }
                  ]
                : [],
              total: p ? 2 : 0
            });
          }
          // Recherche marché : on filtre comme le ferait le serveur.
          const q = (params.get('q') || '').toLowerCase();
          const rarity = params.get('rarity');
          const type = params.get('type');
          const pool = [
            { id: 'a', characterId: 10668, character: CHARACTERS[1], type: 'auction', price: 1, buyoutPrice: 9, prices: PRICES[10668] },
            { id: 'b', characterId: 282077, character: CHARACTERS[2], type: 'fixed', price: 7, buyoutPrice: null, prices: PRICES[282077] },
            { id: 'c', characterId: 999001, character: CHARACTERS[4], type: 'auction', price: 30, buyoutPrice: 70, prices: PRICES[999001] },
            { id: 'd', characterId: 127691, character: CHARACTERS[0], type: 'fixed', price: 1200, buyoutPrice: null, prices: PRICES[127691] }
          ];
          const items = pool.filter(
            (item) =>
              (!q || `${item.character.name} ${item.character.series}`.toLowerCase().includes(q)) &&
              (!rarity || item.character.rarity === rarity) &&
              (!type || item.type === type)
          );
          return json({ items, total: items.length });
        }

        return json({});
      };
    </script>

    <!-- Même contenu que manifest.json (content_scripts : seul ui.js). Le duel est la page
         /duel/duel.html (iframe du panneau). duel-data.js n'est chargé ici que comme jeu de
         données : ?duel=1 donne au compte simulé les 8 premières Mythiques. -->
    <script src="/content/duel-data.js"></script>
    <script src="/content/ui.js"></script>
    <script>
      setTimeout(() => {
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'k', altKey: true, bubbles: true }));
        log('Alt+K envoyé');
      }, 900);
    </script>

    <!-- Reproduit la boîte de présence du site : « Tu es toujours là ? » / « Je suis là ».
         Ouvrir la page avec ?afk=1 pour la faire apparaître après 3 s. -->
    <script>
      if (new URLSearchParams(location.search).has('afk')) {
        setTimeout(() => {
          const wrap = document.createElement('div');
          wrap.id = 'afk-check';
          wrap.style.cssText =
            'position:fixed;inset:0;display:grid;place-items:center;z-index:99998;background:rgba(0,0,0,.28)';
          wrap.innerHTML = `
            <div role="dialog" aria-modal="true" style="background:#12141c;border:1px solid #2b2f3a;border-radius:14px;padding:22px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)">
              <div style="width:46px;height:46px;margin:0 auto 12px;border-radius:50%;background:rgba(255,90,60,.16);color:#ff6b4a;display:grid;place-items:center;font-size:20px">⏱</div>
              <p style="margin:0 0 16px;font:600 14px system-ui,sans-serif;color:#f3f4f7">Tu es toujours là ?</p>
              <button id="afk-yes" type="button" style="padding:8px 20px;border:0;border-radius:8px;background:#ff5a3c;color:#fff;font:700 12.5px system-ui,sans-serif;cursor:pointer">Je suis là</button>
            </div>`;
          document.body.appendChild(wrap);
          document.getElementById('afk-yes').addEventListener('click', () => {
            window.__afkClicks = (window.__afkClicks || 0) + 1;
            wrap.remove();
            log('AFK : « Je suis là » cliqué');
          });
          log('AFK : boîte affichée');
        }, 3000);
      }
    </script>
  </body>
