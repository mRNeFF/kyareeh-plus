<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Kyareeh+ harness</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0b0c10; color: #fff; font-family: system-ui, sans-serif; }
      body { padding: 24px; }
      h1 { font-size: 16px; color: #ff8a6d; }
      p { color: #9aa0ae; font-size: 12px; max-width: 520px; }
      #log { margin-top: 18px; padding: 10px; border: 1px solid #2d303a; border-radius: 8px; background: #121318; font: 11px ui-monospace, monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Kyareeh+ — harness de test</h1>
      <p>Page locale avec API simulée. Le panneau doit s'ouvrir automatiquement (Alt+K).</p>
      <div id="log"></div>

    <script>
      const logEl = document.getElementById('log');
      const log = (msg) => { logEl.textContent += msg + '\n'; };
      window.addEventListener('error', (e) => log('ERROR: ' + e.message));
      window.addEventListener('unhandledrejection', (e) => log('REJECTION: ' + (e.reason?.message || e.reason)));

      const store = {};
      window.__harnessStore = store;
      window.browser = {
        storage: {
          local: {
            get: async (key) => ({ [key]: store[key] }),
            set: async (obj) => Object.assign(store, obj)
          }
        },
        runtime: {
          getURL: (path) => '/' + path,
          onMessage: { addListener: () => {} }
        },
        tabs: {}
      };

      const CHARACTERS = [
        { id: 127691, name: 'Satoru Gojou', rarity: 'M', series: 'JUJUTSU KAISEN', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b127691-9zqh1xpIubn7.png' },
        { id: 10668, name: 'Conis', rarity: 'C', series: 'ONE PIECE', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b10668-JCNeCZ2ap8UR.png' },
        { id: 282077, name: 'Vegapunk', rarity: 'C', series: 'ONE PIECE', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b282077-sPmt79g4douV.jpg' },
        { id: 21122, name: 'Mikoto Uchiha', rarity: 'C', series: 'Naruto', image: 'https://s4.anilist.co/file/anilistcdn/character/large/n21122-blSqxSAMDwXf.png' },
        { id: 999001, name: 'Naruto Uzumaki', rarity: 'L', series: 'Naruto', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b17-6LajS4M0J8c0.png' },
        { id: 999002, name: 'Monkey D. Luffy', rarity: 'E', series: 'ONE PIECE', image: 'https://s4.anilist.co/file/anilistcdn/character/large/b40-5K1xJ0m6w7jK.png' }
      ];

      const PRICES = {
        127691: { median7d: 1200, median30d: 1100, sales7d: 4, sales30d: 9 },
        10668: { median7d: 3, median30d: 3, sales7d: 50, sales30d: 50 },
        282077: { median7d: 16, median30d: 16, sales7d: 83, sales30d: 85 },
        21122: { median7d: 4, median30d: 4, sales7d: 40, sales30d: 44 },
        999001: { median7d: 90, median30d: 80, sales7d: 12, sales30d: 20 },
        999002: { median7d: 25, median30d: 22, sales7d: 30, sales30d: 41 }
      };

      const COLLECTION = [
        { characterId: 127691, qty: 2, listable: 1 },
        { characterId: 10668, qty: 4, listable: 3 },
        { characterId: 282077, qty: 3, listable: 2 },
        { characterId: 21122, qty: 1, listable: 0 },
        { characterId: 999001, qty: 2, listable: 1 },
        { characterId: 999002, qty: 1, listable: 0 }
      ];

      const CONFIG = {
        catalogSize: 6736,
        freePacks: { max: 10 },
        recycle: { C: 1, U: 1, R: 3, E: 10, L: 40, M: 150 },
        pity: { threshold: 250, rarity: 'M' }
      };

      const json = (data) => new Response(JSON.stringify(data), { status: 200, headers: { 'content-type': 'application/json' } });

      const realFetch = window.fetch.bind(window);
      window.fetch = async (input, init) => {
        const url = String(input);
        if (!url.includes('/api/')) return realFetch(input, init);
        log('API ' + (init?.method || 'GET') + ' ' + url);

        const path = new URL(url, location.href).pathname;

        if (path.endsWith('/open-many')) {
          const body = JSON.parse(init?.body || '{}');
          const n = Math.max(1, Math.min(10, Number(body.count) || 1));
          const pool = CHARACTERS;
          const results = Array.from({ length: n }, (_, i) => ({
            cards: [pool[(i + n) % pool.length]],
            golden: i === 0,
            godPack: false,
            pity: false
          }));
          return json({ results });
        }
        if (path === '/api/me/packs') return json({ grants: {}, limits: {} });
        if (path === '/api/me') {
          return json({
            id: 'u-axel',
            pseudo: 'Axel',
            chakra: 12345,
            freePacks: 7,
            bonusPacks: 2,
            freePacksMax: 10,
            pity: 120
          });
        }

        if (url.includes('/api/me/collection/prices')) {
          const ids = new URL(url, location.href).searchParams.get('ids').split(',');
          return json(ids.map((id) => ({ characterId: Number(id), ...(PRICES[id] || {}) })));
        }
        if (url.includes('/api/me/bootstrap')) {
          return json({
            me: {
              id: 'u-axel',
              pseudo: 'Axel',
              avatar: null,
              title: 'Collectionneur',
              rank: { id: 'expert', label: 'Expert', points: 9819 },
              chakra: 12345,
              freePacks: 7,
              freePacksMax: 10,
              bonusPacks: 2,
              pity: 120
            },
            wishlist: []
          });
        }
        if (url.includes('/api/me/collection')) return json(COLLECTION);
        if (url.includes('/api/characters')) return json(CHARACTERS);
        if (url.includes('/api/config')) return json(CONFIG);
        if (url.includes('/api/me/market')) {
          return json({
            listings: [
              { id: 'mine-1', characterId: 10668, character: CHARACTERS[1], type: 'fixed', price: 42, status: 'active', endsAt: new Date(Date.now() + 8 * 3600e3).toISOString() },
              { id: 'mine-2', characterId: 282077, character: CHARACTERS[2], type: 'auction', price: 5, currentBid: 7, bidCount: 2, status: 'active', endsAt: new Date(Date.now() + 3 * 3600e3).toISOString() },
              { id: 'mine-3', characterId: 21122, character: CHARACTERS[3], type: 'fixed', price: 9, status: 'sold', endsAt: new Date(Date.now() - 3600e3).toISOString() }
            ],
            buyOrders: []
          });
        }
        if (url.includes('/api/trades/owned/')) {
          return json([127691, 999001, 10668, 282077, 21122, 999002, 127691]);
        }
        if (url.includes('/api/fair-play/prices')) {
          const ids = new URL(url, location.href).searchParams.get('ids').split(',');
          const out = {};
          for (const id of ids) {
            const p = PRICES[id];
            out[id] = p ? p.median7d : 0;
          }
          return json(out);
        }
        if (url.includes('/api/packs')) {
          const packChars = url.match(/\/api\/packs\/([^/]+)\/characters/);
          if (packChars) {
            const id = packChars[1];
            const pool = id === 'premium' ? [127691, 999001, 45627] : [127691, 999001, 10668, 282077, 21122, 999002, 45627, 40];
            return json(pool);
          }
          const mk = (id, name, color, price, slots, perRarity, extra = {}) => ({
            id,
            name,
            color,
            price: 0,
            chakraPrice: price,
            usesFreePacks: true,
            goldenEligible: true,
            grantOnly: false,
            slots,
            rateUp: null,
            schedule: null,
            pool: {},
            rates: {
              poolSize: 8,
              cardsByRarity: { C: 3, U: 0, R: 0, E: 1, L: 1, M: 1 },
              slots: slots.map((min, i) => ({
                min,
                pct:
                  i === 0
                    ? { C: 62, U: 25, R: 11.4, E: 1.4, L: 0.15, M: 0.025 }
                    : i === 1
                      ? { C: 0, U: 65.8, R: 30.1, E: 3.68, L: 0.39, M: 0.065 }
                      : { C: 0, U: 0, R: 87.8, E: 10.79, L: 1.15, M: 0.19 }
              })),
              perBooster: perRarity,
              golden: {
                slots: [
                  { min: 'C', pct: { C: 62, U: 25, R: 11.4, E: 1.4, L: 0.15, M: 0.025 } },
                  { min: 'C', pct: { C: 62, U: 25, R: 11.4, E: 1.4, L: 0.15, M: 0.025 } },
                  { min: 'U', pct: { C: 0, U: 65.8, R: 30.1, E: 3.68, L: 0.39, M: 0.065 } },
                  { min: 'R', pct: { C: 0, U: 0, R: 87.8, E: 10.79, L: 1.15, M: 0.19 } },
                  { min: 'E', pct: { C: 0, U: 0, R: 0, E: 88.9, L: 9.52, M: 1.59 } }
                ]
              }
            },
            ...extra
          });
          return json([
            mk('all', 'Shōnen Mix', '#F5C518', 150, ['C', 'C', 'R'], { M: { perCardPct: 0.15 } }),
            mk('premium', 'Premium Deluxe', '#ff4d2e', 600, ['R', 'R', 'E'], { M: { perCardPct: 0.4 } }, {
              rateUp: { characterIds: [127691, 45627], rarities: ['M'], share: 0.5 }
            })
          ]);
        }
        if (url.includes('/api/me/friends/search')) {
          const q = new URL(url, location.href).searchParams.get('q') || '';
          if (!q.trim()) return json([]);
          // Joue le cas qui cassait la recherche : un joueur à petite collection,
          // absent du top 10 du classement.
          if (/^amo/i.test(q)) {
            return json([
              {
                id: 'amo-uuid',
                pseudo: 'Amo',
                avatar: null,
                rank: { id: 'rookie', label: 'Rookie' },
                owned: 12,
                mythics: 0,
                points: 40,
                status: 'friends'
              },
              {
                id: 'amoulle-uuid',
                pseudo: 'Amoulle',
                avatar: null,
                rank: { id: 'expert', label: 'Expert' },
                owned: 5499,
                mythics: 12,
                points: 9819,
                status: 'none'
              }
            ]);
          }
          return json([]);
        }
        if (url.includes('/api/leaderboard/ladder')) {
          return json({
            by: 'collection',
            rows: [],
            me: null,
            found: [
              {
                pos: 11704,
                id: '62937049-55d0-4534-8b0f-7e4de3cdc278',
                pseudo: 'neffeeh',
                avatar: null,
                rank: { id: 'expert', label: 'Expert' },
                owned: 1901,
                mythics: 6,
                points: 9819
              }
            ],
            total: 90129
          });
        }
        if (/\/api\/users\/[^/]+$/.test(url)) {
          return json({
            id: '62937049-55d0-4534-8b0f-7e4de3cdc278',
            pseudo: 'neffeeh',
            rank: { id: 'expert', label: 'Expert' },
            catalogSize: 6736,
            byRarity: { C: 1500, U: 300, R: 80, E: 18, L: 3 },
            best: [
              { id: 127691, name: 'Satoru Gojou', rarity: 'M', series: 'JUJUTSU KAISEN', image: CHARACTERS[0].image },
              { id: 999001, name: 'Naruto Uzumaki', rarity: 'L', series: 'Naruto', image: CHARACTERS[4].image }
            ],
            blocks: [],
            locked: [],
            listings: [],
            buyOrders: []
          });
        }
        if (url.includes('/api/me/market/access')) return json({ allowed: true });

        const priceMatch = url.match(/\/api\/market\/prices\/(\d+)/);
        if (priceMatch) {
          const id = priceMatch[1];
          return json({ characterId: Number(id), ...(PRICES[id] || { median7d: null, median30d: null, sales7d: 0 }) });
        }

        if (url.includes('/api/market/buy-orders')) {
          const id = new URL(url, location.href).searchParams.get('characterId');
          const p = PRICES[id];
          return json(p ? [{ price: Math.max(1, p.median7d - 1), qty: 2, status: 'open' }] : []);
        }

        if (url.includes('/api/market/listings')) {
          const params = new URL(url, location.href).searchParams;
          const id = params.get('characterId');
          if (id) {
            const p = PRICES[id];
            const c = CHARACTERS.find((x) => String(x.id) === String(id));
            return json({ items: p ? [{ id: 'l-' + id, characterId: Number(id), character: c, type: 'fixed', price: p.median7d + 2, prices: p }] : [], total: 1 });
          }
          return json({
            items: [
              { id: 'a', characterId: 10668, character: CHARACTERS[1], type: 'auction', price: 1, buyoutPrice: 9, prices: PRICES[10668] },
              { id: 'b', characterId: 282077, character: CHARACTERS[2], type: 'fixed', price: 7, buyoutPrice: null, prices: PRICES[282077] },
              { id: 'c', characterId: 999001, character: CHARACTERS[4], type: 'auction', price: 30, buyoutPrice: 70, prices: PRICES[999001] }
            ],
            total: 3
          });
        }

        return json({});
      };
    </script>

    <script src="/content/ui.js"></script>
    <script>
      setTimeout(() => {
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'k', altKey: true, bubbles: true }));
        log('Alt+K envoyé');
      }, 900);
    </script>
  </body>
</html>
